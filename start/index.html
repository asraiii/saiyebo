<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2499D0">
<title>사이예보 시작하기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><meta name="description" content="두 사람의 정보를 입력하고 오늘의 사이예보를 확인해보세요.">
<link rel="stylesheet" href="/start/start.css?v=2.3">
</head>
<body>
<main class="start-app">
<header><a href="/" aria-label="사이예보 홈">사이예보</a><nav class="start-links" aria-label="페이지 이동"><a href="/">오늘</a><a href="/history/">기록</a></nav></header>
<section class="intro">
<div class="intro-weather" aria-hidden="true"><img src="/assets/weather/soft-3d/partly-cloudy-day.svg?v=16.6" alt=""></div>
<div class="intro-copy"><h1>오늘 우리 사이,<br>맑을까요?</h1><p>두 사람의 정보로 오늘의 관계 날씨를 확인해보세요.</p></div>
</section>
<form id="couple-form" novalidate>
<section class="person-block"><div class="field"><label for="myName">내 이름 <em>선택</em></label><input id="myName" name="myName" type="text" maxlength="20" placeholder="나"></div><div class="field"><label for="myBirth">내 생년월일</label><input id="myBirth" name="myBirth" type="date" required autocomplete="bday"></div></section>
<section class="person-block"><div class="field"><label for="partnerName">상대 이름 <em>선택</em></label><input id="partnerName" name="partnerName" type="text" maxlength="20" placeholder="상대"></div><div class="field"><label for="partnerBirth">상대 생년월일</label><input id="partnerBirth" name="partnerBirth" type="date" required></div></section>
<fieldset><legend>지금 우리 관계</legend><div class="relation-options"><label><input type="radio" name="relationshipType" value="some"><span>썸</span></label><label><input type="radio" name="relationshipType" value="dating" checked><span>연애</span></label></div></fieldset>
<div class="field start-date-field"><label for="startDate">관계 시작일</label><input id="startDate" name="startDate" type="date" required></div>
<p class="error" id="form-error" role="alert" aria-live="polite"></p>
<button class="submit" type="submit">오늘의 사이예보 보기</button>
</form>
</main>
<script src="/start/start.js?v=2.2"></script>
</body>
</html>
