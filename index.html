<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef4f6"><title>사이예보 — 오늘 우리 사이, 맑을까요?</title><meta name="description" content="두 사람의 관계를 매일 날씨처럼 확인하는 사이예보"><link rel="stylesheet" href="styles.css?v=3"></head>
<body><main class="app">
<header class="topbar"><div><span class="brand">사이예보</span><span id="today" class="date"></span></div><button class="menu" aria-label="메뉴">•••</button></header>
<section class="hero">
<div class="hero-copy"><p class="eyebrow">TODAY'S RELATIONSHIP</p><h1>오늘 우리 사이,<br><strong>맑을까요?</strong></h1><p class="lead">대체로 편안한 흐름이에요.<br>저녁에는 말투를 조금만 부드럽게.</p></div>
<div class="weather-orb" aria-hidden="true"><div class="orb-sun"></div><div class="orb-cloud"></div></div>
<div class="temp-row"><div><span class="temp">27°</span><span class="condition">대체로 맑음</span></div><div class="highlow"><span>최고 <b>30°</b></span><span>최저 <b>22°</b></span></div></div>
</section>
<section class="panel hourly-panel"><div class="section-title"><h2>시간별 예보</h2><span>오늘</span></div><div id="hourly" class="hourly"></div></section>
<section class="notice"><div class="notice-top"><span>관계특보</span><b>서운함 주의</b></div><p>20:00–22:00 · 사소한 말투가 오래 남을 수 있어요.</p></section>
<section class="panel metrics"><div class="section-title"><h2>오늘의 관계기상</h2><span>DETAIL</span></div><div class="metric-grid"><div><span>서운함 강수확률</span><strong>20<small>%</small></strong></div><div><span>애정습도</span><strong>76<small>%</small></strong></div><div><span>감정풍속</span><strong>2.4<small>m/s</small></strong></div></div></section>
<section class="panel week-panel"><div class="section-title"><h2>이번 주 사이예보</h2><span>7 DAYS</span></div><div id="week"></div></section>
<button class="share" id="shareBtn">오늘 사이예보 공유하기</button><footer>SAIYEBO · RELATIONSHIP WEATHER</footer>
</main><script src="app.js?v=3"></script></body></html>
