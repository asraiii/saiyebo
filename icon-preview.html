<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>사이예보 후보</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f7fa;color:#18364a}.wrap{max-width:820px;margin:auto;padding:28px 16px 60px}h1{font-size:23px;margin:0 0 8px}p{color:#668296;line-height:1.65}.board{margin-top:24px;background:#fff;border:1px solid #e1eaf0;border-radius:22px;padding:14px;overflow:hidden}.board img{display:block;width:100%;height:auto;border-radius:14px}.note{margin-top:16px;background:#fff;border-radius:16px;padding:16px;font-size:13px;line-height:1.7}</style></head><body><main class=wrap><h1>사이예보 · Getillustrations Weather 3D 후보</h1><p>연관 없는 Freepik 이미지는 폐기했습니다. 이번에는 실제 날씨 전용 62종 세트의 공식 포트폴리오 원본 프리뷰를 사용합니다.</p><div class=board><img src="https://cdn.dribbble.com/userupload/12944901/file/original-60baefa3440135c24c8c9f2432ef2caf.jpg?resize=752x&vertical=center" alt="Getillustrations 3D Weather icons"></div><div class=note>흰 구름을 중심으로 태양·비·눈·뇌우가 같은 재질로 구성되고, 이전의 과도한 glossy 3D보다 표면 표현이 부드럽습니다. 62종이라 상태 구분 폭은 충분합니다. 다만 유료 팩($35)이므로 이번에도 <b>스타일 선별용</b>입니다. 사이예보 Production 미적용.</div></main></body></html>
