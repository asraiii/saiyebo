<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사이예보 · Flat Weather Icons 후보</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#17384d}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 48px}
.head{margin-bottom:18px}
h1{margin:0 0 8px;font-size:24px;line-height:1.25}
.sub{margin:0;color:#6d8493;font-size:14px;line-height:1.65}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #dfe8ee;font-size:12px;font-weight:700;color:#466173}
.panel{background:#fff;border:1px solid #dfe8ee;border-radius:20px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{min-width:0;border:1px solid #e4ebf0;border-radius:16px;padding:14px 8px 12px;text-align:center;background:#fbfdfe}
.card img{width:64px;height:64px;display:block;margin:0 auto 8px;object-fit:contain}
.name{font-size:13px;font-weight:700}
.note{font-size:10px;color:#9aabb6;margin-top:4px;min-height:14px}
.small{margin-top:16px;padding-top:16px;border-top:1px solid #edf1f4}
.small h2{font-size:14px;margin:0 0 12px}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px}
.s{flex:0 0 auto;width:54px;text-align:center;font-size:10px;color:#607785}
.s img{width:30px;height:30px;display:block;margin:0 auto 5px;object-fit:contain}
.foot{margin-top:14px;color:#7a909e;font-size:12px;line-height:1.6}
@media(max-width:520px){
 .wrap{padding:22px 14px 40px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .card img{width:72px;height:72px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>Flat Weather Icons 실제 SVG 후보</h1>
    <p class="sub">SVG Repo의 실제 원본 SVG를 그대로 표시합니다. 제작·재해석 없이 후보 에셋만 비교합니다.</p>
    <div class="meta">
      <span class="badge">실제 SVG 원본</span>
      <span class="badge">CC0</span>
      <span class="badge">프로덕션 미적용</span>
    </div>
  </div>
  <section class="panel">
    <div class="grid">
      <div class="card"><img src="https://www.svgrepo.com/show/331686/sun.svg" alt="맑음"><div class="name">맑음</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331686/sun.svg" alt="폭염"><div class="name">폭염</div><div class="note">전용 아이콘 없음</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331662/partlycloud.svg" alt="구름 조금"><div class="name">구름 조금</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331689/cloud.svg" alt="흐림"><div class="name">흐림</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331694/lightrain.svg" alt="비"><div class="name">비</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331668/rainthunder.svg" alt="폭우"><div class="name">폭우</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331677/snow.svg" alt="눈"><div class="name">눈</div></div>
      <div class="card"><img src="https://www.svgrepo.com/show/331683/snowthunder.svg" alt="폭설"><div class="name">폭설</div><div class="note">폭설 전용은 아님</div></div>
    </div>
    <div class="small">
      <h2>30px 소형 표시 확인</h2>
      <div class="strip">
        <div class="s"><img src="https://www.svgrepo.com/show/331686/sun.svg" alt="">맑음</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331686/sun.svg" alt="">폭염</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331662/partlycloud.svg" alt="">구름</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331689/cloud.svg" alt="">흐림</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331694/lightrain.svg" alt="">비</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331668/rainthunder.svg" alt="">폭우</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331677/snow.svg" alt="">눈</div>
        <div class="s"><img src="https://www.svgrepo.com/show/331683/snowthunder.svg" alt="">폭설</div>
      </div>
    </div>
    <p class="foot">색상과 강수 상태 구분은 확인 가능하지만, 폭염 전용 아이콘과 순수한 폭설 전용 아이콘이 없어서 현재 단계에서는 생산용 확정 후보가 아니라 시각 방향 검토용입니다.</p>
  </section>
</main>
</body>
</html>
