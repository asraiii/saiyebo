<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>사이예보 후보</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f7fa;color:#18364a}.wrap{max-width:820px;margin:auto;padding:28px 16px 60px}h1{font-size:23px;margin:0 0 8px}p{color:#668296;line-height:1.65}.board{margin-top:24px;background:#fff;border:1px solid #e1eaf0;border-radius:22px;padding:14px;overflow:hidden}.board img{display:block;width:100%;height:auto;border-radius:14px}.note{margin-top:16px;background:#fff;border-radius:16px;padding:16px;font-size:13px;line-height:1.7}</style></head><body><main class=wrap><h1>사이예보 · Soft Weather Icons 후보</h1><p>Getillustrations의 강한 3D는 폐기했습니다. 이번에는 볼륨을 한 단계 더 낮추고, 채워진 컬러 면과 아주 얕은 음영만 남긴 soft-weather 방향입니다.</p><div class=board><img src="https://cdn.dribbble.com/users/1787323/screenshots/10748882/media/8f8d5fda6c834d6930b2d55ac2c21880.png" alt="Soft colorful weather icon set"></div><div class=note>실제 공개 포트폴리오 프리뷰를 그대로 사용합니다. 이번 평가는 ‘3D 오브젝트’가 아니라 <b>2.5D에 가까운 부드러운 컬러 날씨 아이콘</b>이 사이예보에 더 자연스러운지 확인하는 단계입니다. 원본 사용권이 확정되지 않았으므로 Production 미적용.</div></main></body></html>
